<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Foot Rig Lab</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><b>Foot Rig Lab</b><span id="status">Loading…</span></header><main id="viewer"><div id="dropHint">Choose ProductionRig v1 GLB</div></main><section id="panel"><div class="row"><input id="file" type="file" accept=".glb,.gltf"><button id="reset">Reset Pose</button><button id="frame">Frame Model</button></div><div class="row"><label><input id="skeleton" type="checkbox" checked> Skeleton</label><label><input id="wire" type="checkbox"> Wireframe</label><label>Opacity <input id="opacity" type="range" min="0.12" max="1" step="0.01" value="1"></label></div><div class="row"><label><input id="wiggle" type="checkbox"> Toe wiggle</label><label>Speed <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1"></label><label>Amount <input id="amount" type="range" min="2" max="35" step="1" value="14">°</label></div><select id="joint"><option>Load a rigged GLB…</option></select><div class="nudgeHead"><b>Selected bone rotation</b><label>Step <select id="step"><option value="0.25">0.25°</option><option value="0.5">0.5°</option><option value="1" selected>1°</option><option value="2">2°</option><option value="5">5°</option></select></label></div><div id="rot"></div><p>Rotation is in the bone's local coordinate space. Use the buttons for careful testing. Toe wiggle animates only movable toe bones and leaves Heel and Metatarsals unchanged.</p></section></div><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script><script src="app.js"></script></body></html>
