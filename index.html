<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foot Rig Tool</title><link rel="stylesheet" href="style.css">
</head><body>
<div id="app">
<header><b>Foot Rig Tool</b><span id="status">Loading…</span></header>
<main id="viewer"><div id="dropHint">Choose a GLB to begin</div></main>
<section id="panel">
<div class="row"><input id="file" type="file" accept=".glb,.gltf"><button id="copy">Copy Rig JSON</button><button id="restore">Restore Auto-Save</button></div>
<div class="row"><label><input id="mirror" type="checkbox" checked> Mirror edits</label><label><input id="wire" type="checkbox"> Wireframe</label><label>Opacity <input id="opacity" type="range" min="0.08" max="1" step="0.01" value="0.55"></label></div>
<select id="joint"></select>
<div id="coords"></div>
<p>Hierarchy: Leg → Ankle → five Metatarsals + Heel. Heel and Metatarsals are static.</p>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="app.js"></script></body></html>
